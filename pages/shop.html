<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop — Now That Its Over Records</title>
  <link rel="stylesheet" href="../css/style.css" />

</head>
<body>
<div class="site-wrap">

<!-- Hand-drawn border filter -->
<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute">
  <defs>
    <filter id="hand-drawn" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="2" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>

  <header class="site-header">
    <div class="logo-wrap">
      <img src="../images/logo-dog.png" alt="Now That Its Over Records logo" class="logo-icon" />
      <span class="logo-text">NOW THAT ITS OVER RECORDS</span>
    </div>
    <nav class="main-nav">
        <a href="../index.html" class="nav-link">HOME</a>
        <a href="releases.html" class="nav-link">RELEASES</a>
        <a href="artists.html" class="nav-link">ARTISTS</a>
        <a href="shop.html" class="nav-link active">SHOP</a>
        <a href="submit.html" class="nav-link">SUBMIT</a>
        <a href="about.html" class="nav-link">ABOUT</a>
        <a href="contact.html" class="nav-link">CONTACT</a>
    </nav>
  </header>

  <main>
    <section class="page-hero">
      <div class="container">
        <h1 class="heading-mad page-title">SHOP</h1>
      </div>
    </section>
    <section class="page-content">
      <div class="container">
        <div class="shop-grid">
          <div class="shop-item">
            <div class="shop-img"><img src="../images/shop-placeholder-1.png" alt="Product" /></div>
            <p class="shop-name">ITEM NAME</p>
            <p class="shop-price">$00.00</p>
            <button class="btn-primary">ADD TO CART</button>
          </div>
          <div class="shop-item">
            <div class="shop-img"><img src="../images/shop-placeholder-2.png" alt="Product" /></div>
            <p class="shop-name">ITEM NAME</p>
            <p class="shop-price">$00.00</p>
            <button class="btn-primary">ADD TO CART</button>
          </div>
          <div class="shop-item">
            <div class="shop-img"><img src="../images/shop-placeholder-3.png" alt="Product" /></div>
            <p class="shop-name">ITEM NAME</p>
            <p class="shop-price">$00.00</p>
            <button class="btn-primary">ADD TO CART</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p class="footer-name">NOW THAT ITS OVER RECORDS</p>
    <p class="footer-copy">© 2026 ALL RIGHTS RESERVED.</p>
  </footer>
  <script src="../js/main.js"></script>
</div>

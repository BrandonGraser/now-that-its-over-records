<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Submit — Now That Its Over Records</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/pages.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="logo-wrap">
        <img src="../images/logo-dog.png" alt="Now That Its Over Records logo" class="logo-icon" />
        <span class="logo-text">NOW THAT ITS OVER RECORDS</span>
      </div>
      <nav class="main-nav">
        <a href="../index.html" class="nav-link">HOME</a>
        <a href="releases.html" class="nav-link">RELEASES</a>
        <a href="artists.html" class="nav-link">ARTISTS</a>
        <a href="shop.html" class="nav-link">SHOP</a>
        <a href="submit.html" class="nav-link active">SUBMIT</a>
        <a href="about.html" class="nav-link">ABOUT</a>
        <a href="contact.html" class="nav-link">CONTACT</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-hero">
      <div class="container">
        <h1 class="heading-mad page-title">SUBMIT</h1>
        <p class="subheading" style="margin-top:0.5rem;">SEND US YOUR MUSIC</p>
      </div>
    </section>
    <section class="page-content">
      <div class="container form-wrap">
        <p class="form-intro">
          We accept demos on a rolling basis. We listen to everything submitted.
          Please include a link to your music and a brief note about yourself.
        </p>
        <div class="form-group">
          <label class="form-label" for="name">NAME</label>
          <input class="form-input" type="text" id="name" name="name" placeholder="Artist / Band name" />
        </div>
        <div class="form-group">
          <label class="form-label" for="email">EMAIL</label>
          <input class="form-input" type="email" id="email" name="email" placeholder="your@email.com" />
        </div>
        <div class="form-group">
          <label class="form-label" for="link">MUSIC LINK</label>
          <input class="form-input" type="url" id="link" name="link" placeholder="Soundcloud, Bandcamp, Drive link..." />
        </div>
        <div class="form-group">
          <label class="form-label" for="message">ABOUT YOU</label>
          <textarea class="form-input form-textarea" id="message" name="message" placeholder="Tell us a bit about your sound and what you're looking for..."></textarea>
        </div>
        <button class="btn-primary btn-submit">SUBMIT DEMO</button>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p class="footer-name">NOW THAT ITS OVER RECORDS</p>
    <p class="footer-copy">© 2026 ALL RIGHTS RESERVED.</p>
  </footer>
  <script src="../js/main.js"></script>
</body>
</html>

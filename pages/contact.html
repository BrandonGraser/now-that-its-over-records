<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Now That Its Over Records</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/pages.css" />
</head>
<body>
<div class="site-wrap">
  <header class="site-header">
    <div class="logo-wrap">
      <img src="../images/logo-dog.png" alt="Now That Its Over Records logo" class="logo-icon" />
      <span class="logo-text">NOW THAT ITS OVER RECORDS</span>
    </div>
    <nav class="main-nav">
        <a href="../index.html" class="nav-link">HOME</a>
        <a href="releases.html" class="nav-link">RELEASES</a>
        <a href="artists.html" class="nav-link">ARTISTS</a>
        <a href="shop.html" class="nav-link">SHOP</a>
        <a href="submit.html" class="nav-link">SUBMIT</a>
        <a href="about.html" class="nav-link">ABOUT</a>
        <a href="contact.html" class="nav-link active">CONTACT</a>
    </nav>
  </header>

  <main>
    <section class="page-hero">
      <div class="container">
        <h1 class="heading-mad page-title">CONTACT</h1>
      </div>
    </section>
    <section class="page-content">
      <div class="container form-wrap">
        <p class="form-intro">
          For business enquiries, press, or general questions — reach out below.
          For demo submissions, please use the <a href="submit.html" style="text-decoration:underline;">Submit</a> page.
        </p>
        <div class="form-group">
          <label class="form-label" for="c-name">NAME</label>
          <input class="form-input" type="text" id="c-name" name="name" placeholder="Your name" />
        </div>
        <div class="form-group">
          <label class="form-label" for="c-email">EMAIL</label>
          <input class="form-input" type="email" id="c-email" name="email" placeholder="your@email.com" />
        </div>
        <div class="form-group">
          <label class="form-label" for="c-subject">SUBJECT</label>
          <input class="form-input" type="text" id="c-subject" name="subject" placeholder="What's this about?" />
        </div>
        <div class="form-group">
          <label class="form-label" for="c-message">MESSAGE</label>
          <textarea class="form-input form-textarea" id="c-message" name="message" placeholder="Your message..."></textarea>
        </div>
        <button class="btn-primary btn-submit">SEND MESSAGE</button>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p class="footer-name">NOW THAT ITS OVER RECORDS</p>
    <p class="footer-copy">© 2026 ALL RIGHTS RESERVED.</p>
  </footer>
  <script src="../js/main.js"></script>
</div>
</body>
</html>
